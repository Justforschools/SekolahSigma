<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Sigma Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Trebuchet MS', sans-serif; }
        .form-input {
            width: 100%; background: #18181b; border: 1px solid #3f3f46;
            padding: 1rem; border-radius: 1rem; color: #fff;
            outline: none; transition: border-color 0.3s; font-size: 0.9rem;
        }
        .form-input:focus { border-color: #facc15; }
        .form-label {
            display: block; font-size: 10px; font-weight: 900; color: #71717a;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.2em;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card-masuk { animation: slideUp 0.5s ease forwards; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">

    <nav class="p-8">
        <a href="index.html" class="text-yellow-400 font-black text-3xl italic tracking-tighter">SIGMACLUB</a>
    </nav>

    <div class="flex-grow flex items-center justify-center px-4 pb-10">
        <div class="card-masuk bg-zinc-950 p-10 md:p-12 rounded-[2rem] border border-zinc-800 w-full max-w-md shadow-2xl">
            <h2 class="text-4xl font-black mb-3 italic text-yellow-400 uppercase tracking-tighter">Akses Masuk</h2>
            <p class="text-zinc-500 text-sm mb-10 italic">Selamat datang kembali, petarung kasta tertinggi.</p>

            <!-- id="loginForm", id="username", id="password" — sesuai LKPD -->
            <form id="loginForm" onsubmit="return false;">
                <div class="space-y-5">
                    <div>
                        <label for="username" class="form-label">Identitas Pengguna</label>
                        <input type="text" id="username" name="username"
                               placeholder="Masukkan nama pengguna..."
                               class="form-input" autocomplete="username">
                    </div>
                    <div>
                        <label for="password" class="form-label">Kata Sandi Rahasia</label>
                        <input type="password" id="password" name="password"
                               placeholder="••••••••"
                               class="form-input" autocomplete="current-password">
                    </div>

                    <!-- onclick ke fungsi global — tidak bergantung pada module load -->
                    <button type="button" id="tombolMasuk"
                            onclick="prosesMasukAwan()"
                            class="w-full bg-yellow-400 text-black font-black py-4 rounded-2xl hover:bg-yellow-500 transition-all uppercase tracking-widest text-sm shadow-lg shadow-yellow-400/20">
                        Verifikasi Sigma
                    </button>
                </div>
            </form>

            <!-- Tekan Enter juga submit -->
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    document.getElementById('loginForm').addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') prosesMasukAwan();
                    });
                });
            </script>

            <p class="text-center mt-8 text-sm text-zinc-600">
                Belum terdaftar? <a href="daftar.html" class="text-yellow-400 font-bold hover:underline">Daftar sekarang</a>
            </p>
            <p class="text-center mt-2 text-xs text-zinc-700 italic">
                Demo: <span class="text-zinc-500">heri</span> / <span class="text-zinc-500">123</span>
                &nbsp;|&nbsp;
                Admin: <span class="text-zinc-500">admin</span> / <span class="text-zinc-500">123</span>
            </p>
        </div>
    </div>

    <!--
        LOGIN SCRIPT — Sesuai LKPD Website Pribadi
        Urutan: 1) REST API herisusanta.my.id  2) Firebase  3) localStorage
        Fungsi window.prosesMasukAwan() bersifat GLOBAL agar onclick bisa memanggilnya
        meskipun modul Firebase belum/gagal load.
    -->
    <script>
        // ── Langkah 1: coba REST API herisusanta.my.id (sesuai LKPD) ──
        async function loginViaAPI(u, p) {
            const res  = await fetch('https://herisusanta.my.id/javalogin/api/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            return await res.json();
        }

        // ── Fungsi utama — global agar onclick bekerja ──
        window.prosesMasukAwan = async function() {
            const u   = document.getElementById('username').value.trim();
            const p   = document.getElementById('password').value.trim();
            const btn = document.getElementById('tombolMasuk');

            if (!u || !p) {
                alert("Isi kolom identitas dan kata sandi terlebih dahulu!");
                return;
            }

            btn.disabled  = true;
            btn.innerText = "MEMVERIFIKASI...";

            try {
                // — STEP 1: REST API sesuai LKPD —
                try {
                    const data = await loginViaAPI(u, p);
                    if (data && (data.token || data.status === 'ok' || data.login === 'success')) {
                        if (data.token) localStorage.setItem('token', data.token);
                        suksesLogin(u, "Server");
                        return;
                    }
                } catch(e) {
                    console.warn("REST API tidak tersedia:", e.message);
                }

                // — STEP 2: Akun bawaan (admin & heri) —
                if (u === "admin" && p === "123") { suksesLogin(u, "Admin"); return; }
                if (u === "heri"  && p === "123") { suksesLogin(u, "Heri");  return; }

                // — STEP 3: Firebase (dynamic import agar tidak blokir tombol) —
                try {
                    const { initializeApp }      = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
                    const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
                    const { getFirestore, doc, getDoc }  = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

                    const firebaseConfig = {
                        apiKey: "", authDomain: "sigmaclub-db.firebaseapp.com",
                        projectId: "sigmaclub-db", storageBucket: "sigmaclub-db.appspot.com",
                        appId: "1:384952934:web:934a34b238"
                    };
                    const app   = initializeApp(firebaseConfig, 'loginApp');
                    const auth  = getAuth(app);
                    const db    = getFirestore(app);
                    const appId = (typeof __app_id !== 'undefined') ? __app_id : 'sigmaclub-app';

                    await signInAnonymously(auth);
                    const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'userData', u));

                    if (snap.exists() && snap.data().sandi === p) {
                        suksesLogin(u, "Cloud");
                        return;
                    }
                } catch(e) {
                    console.warn("Firebase tidak tersedia:", e.message);
                }

                // — STEP 4: localStorage —
                const dbLokal = JSON.parse(localStorage.getItem('databaseSigma') || '{}');
                if (dbLokal[u] && dbLokal[u] === p) {
                    suksesLogin(u, "Lokal");
                    return;
                }

                // — Semua gagal —
                alert("Akses Ditolak!\nIdentitas atau Kata Sandi salah.\nPeriksa kembali data kamu.");

            } finally {
                btn.disabled  = false;
                btn.innerText = "VERIFIKASI SIGMA";
            }
        };

        function suksesLogin(u, sumber) {
            localStorage.setItem('userAktif', u);
            alert("Verifikasi berhasil [" + sumber + "]!\nSelamat datang, " + u + ".");
            if (u.toLowerCase() === 'admin') {
                window.location.assign('admin.html');
            } else {
                window.location.assign('index.html');
            }
        }
    </script>
</body>
</html>
