<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Sigma Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Trebuchet MS', sans-serif; }
        .form-input {
            width: 100%; background: #18181b; border: 1px solid #3f3f46;
            padding: 0.85rem 1rem; border-radius: 0.85rem; color: #fff;
            outline: none; transition: border-color 0.3s; font-size: 0.9rem;
        }
        .form-input:focus { border-color: #facc15; }
        .form-label {
            display: block; font-size: 10px; font-weight: 900; color: #71717a;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.2em;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card-daftar { animation: slideUp 0.5s ease forwards; }
        .kekuatan-bar { height: 4px; border-radius: 99px; transition: width 0.4s, background-color 0.4s; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">

    <nav class="p-8">
        <a href="index.html" class="text-yellow-400 font-black text-2xl italic">SIGMACLUB</a>
    </nav>

    <div class="flex-grow flex items-center justify-center p-4 pb-10">
        <div class="card-daftar bg-zinc-950 p-10 rounded-[2rem] border border-zinc-800 w-full max-w-md shadow-2xl">
            <h2 class="text-3xl font-black italic text-yellow-400 uppercase mb-2">Pendaftaran Elit</h2>
            <p class="text-zinc-500 text-xs mb-8 italic">Tinggalkan kasta lamamu. Bergabunglah dengan kami.</p>

            <!-- id="registerForm", id="username", id="email", id="password" — sesuai LKPD -->
            <form id="registerForm" onsubmit="return false;">
                <div class="space-y-4">

                    <div>
                        <label for="username" class="form-label">Nama Pengguna</label>
                        <input type="text" id="username" name="username"
                               placeholder="Pilih nama pengguna unikmu..."
                               class="form-input" autocomplete="username">
                    </div>

                    <div>
                        <label for="email" class="form-label">Email Terdaftar</label>
                        <input type="email" id="email" name="email"
                               placeholder="nama@domain.com"
                               class="form-input" autocomplete="email">
                    </div>

                    <div>
                        <label for="password" class="form-label">Kata Sandi</label>
                        <input type="password" id="password" name="password"
                               placeholder="Minimal 6 karakter..."
                               class="form-input" autocomplete="new-password"
                               oninput="cekKekuatan(this.value)">
                        <div class="flex gap-1 mt-2">
                            <div id="bar1" class="kekuatan-bar flex-1 bg-zinc-800"></div>
                            <div id="bar2" class="kekuatan-bar flex-1 bg-zinc-800"></div>
                            <div id="bar3" class="kekuatan-bar flex-1 bg-zinc-800"></div>
                        </div>
                        <p id="label-kekuatan" class="text-[10px] mt-1 text-zinc-600 italic"></p>
                    </div>

                    <div>
                        <label for="konfirmasi" class="form-label">Konfirmasi Kata Sandi</label>
                        <input type="password" id="konfirmasi" name="konfirmasi"
                               placeholder="Ulangi kata sandi..."
                               class="form-input">
                    </div>

                    <!-- type="button" + onclick global — TIDAK bergantung pada module -->
                    <button type="button" id="tombolDaftar"
                            onclick="prosesSimpanDaftar()"
                            class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-black py-4 rounded-xl transition-all uppercase text-sm mt-2 shadow-lg shadow-yellow-400/20">
                        Resmikan Identitas
                    </button>
                </div>
            </form>

            <p class="text-center mt-6 text-xs text-zinc-600">
                Sudah punya akun? <a href="masuk.html" class="text-yellow-400 font-bold hover:underline">Masuk di sini</a>
            </p>
        </div>
    </div>

    <!--
        REGISTER SCRIPT — Sesuai LKPD Website Pribadi
        Fungsi window.prosesSimpanDaftar() bersifat GLOBAL.
        Urutan: 1) REST API herisusanta.my.id  2) Firebase  3) localStorage
    -->
    <script>
        // Indikator kekuatan kata sandi
        function cekKekuatan(nilai) {
            var bar1 = document.getElementById('bar1');
            var bar2 = document.getElementById('bar2');
            var bar3 = document.getElementById('bar3');
            var lbl  = document.getElementById('label-kekuatan');
            var abu  = '#3f3f46';
            bar1.style.backgroundColor = abu;
            bar2.style.backgroundColor = abu;
            bar3.style.backgroundColor = abu;
            lbl.innerText = '';
            if (!nilai) return;
            var skor = 0;
            if (nilai.length >= 6)  skor++;
            if (nilai.length >= 10) skor++;
            if (/[0-9]/.test(nilai) && /[a-zA-Z]/.test(nilai)) skor++;
            if (skor === 1) {
                bar1.style.backgroundColor = '#ef4444';
                lbl.style.color = '#ef4444';
                lbl.innerText = 'Kata sandi lemah';
            } else if (skor === 2) {
                bar1.style.backgroundColor = '#f59e0b';
                bar2.style.backgroundColor = '#f59e0b';
                lbl.style.color = '#f59e0b';
                lbl.innerText = 'Kata sandi sedang';
            } else if (skor >= 3) {
                bar1.style.backgroundColor = '#22c55e';
                bar2.style.backgroundColor = '#22c55e';
                bar3.style.backgroundColor = '#22c55e';
                lbl.style.color = '#22c55e';
                lbl.innerText = 'Kata sandi kuat 💪';
            }
        }

        // Tekan Enter juga submit
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('registerForm').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') prosesSimpanDaftar();
            });
        });

        // ── Fungsi daftar global ──
        window.prosesSimpanDaftar = async function() {
            var username   = document.getElementById('username').value.trim();
            var email      = document.getElementById('email').value.trim();
            var password   = document.getElementById('password').value.trim();
            var konfirmasi = document.getElementById('konfirmasi').value.trim();
            var btn        = document.getElementById('tombolDaftar');

            // Validasi
            if (!username || !email || !password || !konfirmasi) {
                alert("Kesalahan: Semua kolom wajib diisi!");
                return;
            }
            if (password !== konfirmasi) {
                alert("Kesalahan: Konfirmasi kata sandi tidak cocok!");
                document.getElementById('konfirmasi').value = '';
                return;
            }
            if (password.length < 6) {
                alert("Kesalahan: Kata sandi minimal 6 karakter!");
                return;
            }
            if (['admin','heri'].indexOf(username.toLowerCase()) !== -1) {
                alert("Nama pengguna '" + username + "' tidak dapat digunakan!");
                return;
            }
            if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
                alert("Nama pengguna hanya boleh huruf, angka, garis bawah (_).\nMinimal 3, maksimal 20 karakter.");
                return;
            }

            btn.disabled  = true;
            btn.innerText = "MEMPROSES...";

            try {
                // ── STEP 1: REST API sesuai LKPD ──
                var apiOk = false;
                try {
                    var res  = await fetch('https://herisusanta.my.id/javalogin/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username, email: email, password: password })
                    });
                    var data = await res.json();
                    if (data && (data.token || data.username || data.status === 'ok')) {
                        apiOk = true;
                    } else if (data && (data.message || data.error)) {
                        var pesan = (data.message || data.error || '').toLowerCase();
                        if (pesan.includes('exist') || pesan.includes('sudah') || pesan.includes('used')) {
                            alert("Nama pengguna '" + username + "' sudah terdaftar di server!");
                            return;
                        }
                    }
                } catch(e) {
                    console.warn("REST API tidak tersedia:", e.message);
                }

                // ── STEP 2: Firebase (dynamic import) ──
                var firebaseOk = false;
                try {
                    var mod1 = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
                    var mod2 = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
                    var mod3 = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

                    var fbCfg = {
                        apiKey: "", authDomain: "sigmaclub-db.firebaseapp.com",
                        projectId: "sigmaclub-db", storageBucket: "sigmaclub-db.appspot.com",
                        appId: "1:384952934:web:934a34b238"
                    };
                    var appName = 'daftarApp_' + Date.now();
                    var fbApp  = mod1.initializeApp(fbCfg, appName);
                    var fbAuth = mod2.getAuth(fbApp);
                    var fbDb   = mod3.getFirestore(fbApp);
                    var appId  = (typeof __app_id !== 'undefined') ? __app_id : 'sigmaclub-app';

                    await mod2.signInAnonymously(fbAuth);
                    var docRef  = mod3.doc(fbDb, 'artifacts', appId, 'public', 'data', 'userData', username);
                    var docSnap = await mod3.getDoc(docRef);

                    if (docSnap.exists()) {
                        alert("Nama pengguna '" + username + "' sudah digunakan di sistem awan!");
                        return;
                    }

                    var dataBaru = { email: email, sandi: password, streak: 0, poin: 0, absenTerakhir: '' };
                    await mod3.setDoc(docRef, dataBaru);
                    firebaseOk = true;

                } catch(e) {
                    console.warn("Firebase tidak tersedia:", e.message);
                }

                // ── STEP 3: localStorage ──
                var dbLokal   = JSON.parse(localStorage.getItem('databaseSigma')  || '{}');
                var dataLokal = JSON.parse(localStorage.getItem('userDataSigma') || '{}');

                if (!firebaseOk && dbLokal[username]) {
                    alert("Nama pengguna '" + username + "' sudah digunakan secara lokal!");
                    return;
                }

                dbLokal[username]   = password;
                dataLokal[username] = { email: email, sandi: password, streak: 0, poin: 0, absenTerakhir: '' };
                localStorage.setItem('databaseSigma',  JSON.stringify(dbLokal));
                localStorage.setItem('userDataSigma', JSON.stringify(dataLokal));

                var sumber = apiOk ? 'Server' : (firebaseOk ? 'Cloud' : 'Lokal');
                alert("✅ Akun '" + username + "' berhasil dibuat [" + sumber + "]!\nSilakan masuk sekarang.");
                window.location.assign('masuk.html');

            } finally {
                btn.disabled  = false;
                btn.innerText = "RESMIKAN IDENTITAS";
            }
        };
    </script>
</body>
</html>
