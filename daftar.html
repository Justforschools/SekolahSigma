<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Daftar - Sigma Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex flex-col">
    <nav class="p-8">
        <a href="index.html" class="text-yellow-400 font-black text-3xl italic tracking-tighter">SIGMACLUB</a>
    </nav>
    
    <div class="flex-grow flex items-center justify-center px-4">
        <div class="bg-zinc-950 p-12 rounded-[2rem] border border-zinc-800 w-full max-w-md shadow-2xl">
            <h2 class="text-4xl font-black mb-3 italic text-yellow-400 uppercase tracking-tighter">Rekrutmen Elit</h2>
            <p class="text-zinc-500 text-sm mb-10 italic">Hancurkan identitas lamamu, buat yang baru sebagai Sigma.</p>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-zinc-500 mb-2 uppercase tracking-[0.2em]">Pilih Nama Unik</label>
                    <input type="text" id="regPengguna" placeholder="Contoh: SigmaJaya" class="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-2xl focus:border-yellow-400 outline-none text-white transition-all font-medium">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-zinc-500 mb-2 uppercase tracking-[0.2em]">Kata Sandi Keamanan</label>
                    <input type="password" id="regSandi" placeholder="Min. 3 Karakter" class="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-2xl focus:border-yellow-400 outline-none text-white transition-all font-medium">
                </div>
                <button onclick="prosesDaftar()" class="w-full bg-yellow-400 text-black font-black py-5 rounded-2xl hover:bg-yellow-500 transition-all uppercase tracking-widest mt-4">Resmikan Akun</button>
            </div>
            
            <p class="text-center mt-10 text-sm text-zinc-600">
                Sudah memiliki akun? <a href="masuk.html" class="text-yellow-400 font-bold hover:underline">Masuk sekarang</a>
            </p>
        </div>
    </div>

    <script>
        function prosesDaftar() {
            const u = document.getElementById('regPengguna').value;
            const p = document.getElementById('regSandi').value;

            if(u.trim() === "" || p.trim() === "") {
                alert("Kesalahan! Semua kolom wajib diisi. Seorang Sigma tidak ceroboh.");
                return;
            }

            let database = JSON.parse(localStorage.getItem('databaseSigma') || '{}');
            
            if(database[u] || u === "heri") {
                alert("Identitas sudah terpakai! Pilih nama lain.");
            } else {
                database[u] = p;
                localStorage.setItem('databaseSigma', JSON.stringify(database));
                alert("Selamat! Akun Elit berhasil dibuat. Silakan lanjut ke halaman masuk.");
                window.location.href = "masuk.html";
            }
        }
    </script>
</body>
</html>
