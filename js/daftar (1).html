<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Sigma Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex flex-col min-h-screen">
    <nav class="p-8">
        <a href="index.html" class="text-yellow-400 font-black text-2xl italic">SIGMACLUB</a>
    </nav>
    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-zinc-950 p-10 rounded-[2rem] border border-zinc-800 w-full max-w-md shadow-2xl">
            <h2 class="text-3xl font-black italic text-yellow-400 uppercase mb-2">Pendaftaran Elit</h2>
            <p class="text-zinc-500 text-xs mb-8 italic">Tinggalkan kasta lamamu, bergabunglah dengan kami.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-zinc-500 mb-1 uppercase tracking-widest">Nama Pengguna</label>
                    <input type="text" id="inputNama" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl focus:border-yellow-400 outline-none transition text-white">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-zinc-500 mb-1 uppercase tracking-widest">Alamat Surel (Email)</label>
                    <input type="email" id="inputEmail" placeholder="nama@surel.com" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl focus:border-yellow-400 outline-none transition text-white">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-zinc-500 mb-1 uppercase tracking-widest">Kata Sandi</label>
                    <input type="password" id="inputSandi" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl focus:border-yellow-400 outline-none transition text-white">
                </div>
                <button onclick="simpanPendaftaran()" class="w-full bg-yellow-400 text-black font-black py-4 rounded-xl hover:scale-[1.02] transition-all uppercase text-sm mt-4">Resmikan Identitas</button>
            </div>
            <p class="text-center mt-6 text-xs text-zinc-600">Sudah punya akun? <a href="masuk.html" class="text-yellow-400 font-bold hover:underline">Masuk di sini</a></p>
        </div>
    </div>
    <script>
        function simpanPendaftaran() {
            const nama = document.getElementById('inputNama').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const sandi = document.getElementById('inputSandi').value.trim();

            if(!nama || !email || !sandi) {
                alert("Peringatan: Semua kolom wajib diisi!");
                return;
            }

            let basisSandi = JSON.parse(localStorage.getItem('databaseSigma') || '{}');
            let basisData = JSON.parse(localStorage.getItem('userDataSigma') || '{}');

            if(basisSandi[nama] || nama === 'admin') {
                alert("Kesalahan: Nama pengguna ini sudah terdaftar.");
                return;
            }

            basisSandi[nama] = sandi;
            basisData[nama] = { email: email, streak: 0, poin: 0, absenTerakhir: '' };

            localStorage.setItem('databaseSigma', JSON.stringify(basisSandi));
            localStorage.setItem('userDataSigma', JSON.stringify(basisData));

            alert("Berhasil! Selamat datang di awal perjalanan barumu.");
            window.location.href = "masuk.html";
        }
    </script>
</body>
</html>
